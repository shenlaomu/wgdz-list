<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>150kv国产版机柜物料购买清单</title>
<style>
  :root{
    --bg:#f4f5f7;
    --card:#ffffff;
    --ink:#191b1f;
    --sub:#6b7280;
    --line:#e7e9ec;
    --brand:#ff5000;
    --brand-soft:#fff1ea;
    --blue:#2563eb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);
    padding:32px 18px 130px;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px;margin:0 auto}

  /* 顶部 */
  header{margin-bottom:18px}
  h1{font-size:25px;font-weight:700;letter-spacing:-.5px}
  .head-sub{color:var(--sub);font-size:13.5px;margin-top:7px;display:flex;gap:14px;flex-wrap:wrap}
  .head-sub b{color:var(--ink)}

  /* 工具条 */
  .toolbar{
    display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap;
    position:sticky;top:0;z-index:20;
    background:rgba(244,245,247,.88);backdrop-filter:blur(10px);
    padding:12px 0;border-bottom:1px solid transparent;
  }
  .search{
    flex:1;min-width:200px;position:relative;
  }
  .search input{
    width:100%;height:40px;border:1px solid var(--line);border-radius:10px;
    padding:0 14px 0 36px;font-size:14px;font-family:inherit;background:#fff;outline:none;
    transition:.15s;
  }
  .search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,80,0,.1)}
  .search svg{position:absolute;left:12px;top:11px;opacity:.4}
  .preset{display:flex;align-items:center;gap:6px}
  .preset span{font-size:12.5px;color:var(--sub)}
  .preset button{
    min-width:34px;height:34px;padding:0 9px;border:1px solid var(--line);background:#fff;
    border-radius:8px;font-size:13px;font-family:inherit;color:var(--ink);cursor:pointer;transition:.15s;
  }
  .preset button:hover{border-color:var(--brand);color:var(--brand)}

  /* 分类 */
  .group{margin-bottom:26px}
  .group-head{
    display:flex;align-items:center;gap:10px;margin-bottom:12px;
    position:sticky;top:64px;z-index:10;
    background:linear-gradient(var(--bg) 62%,rgba(244,245,247,0));
    padding:6px 0 8px;
  }
  .group-head h2{font-size:15px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
  .group-head .dot{width:4px;height:16px;border-radius:2px;background:var(--brand)}
  .group-head .cnt{font-size:12.5px;color:var(--sub)}
  .group-head .gsub{margin-left:auto;font-size:12.5px;color:var(--sub);white-space:nowrap}

  /* 卡片 */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 20px;margin-bottom:10px;
    display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center;
    transition:.15s;
  }
  .card:hover{border-color:#d6d9de;box-shadow:0 3px 12px rgba(0,0,0,.04)}
  .card.q0{opacity:.62}
  .card.hide{display:none}

  .title{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tag{
    font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:20px;
    background:var(--brand-soft);color:var(--brand);letter-spacing:.3px;white-space:nowrap;
  }
  .tag.gray{background:#f0f1f3;color:var(--sub)}
  .meta{color:var(--sub);font-size:12px;margin-top:5px;line-height:1.6}
  .meta .sku{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}

  .stepper{
    display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;
    overflow:hidden;background:#fafbfc;
  }
  .stepper button{
    width:32px;height:32px;border:0;background:transparent;cursor:pointer;
    font-size:17px;color:var(--sub);line-height:1;transition:.15s;
  }
  .stepper button:hover{background:#eceef1;color:var(--brand)}
  .stepper input{
    width:44px;height:32px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);
    text-align:center;font-size:14.5px;font-weight:600;color:var(--ink);background:transparent;
    font-family:inherit;outline:none;
  }
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:9px}
  .price{font-size:12px;color:var(--sub);white-space:nowrap}
  .price b{color:var(--ink);font-size:15px}
  .price .unknown{color:#b45309;font-weight:600}
  .buy{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--brand);color:#fff;border:0;border-radius:9px;
    padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;
    text-decoration:none;transition:.15s;font-family:inherit;white-space:nowrap;
  }
  .buy:hover{background:#e64800;transform:translateY(-1px);box-shadow:0 5px 14px rgba(255,80,0,.25)}
  .buy:active{transform:translateY(0)}

  /* 底栏 */
  .bottom{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  }
  .bottom-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .amt-wrap{display:flex;flex-direction:column}
  .amt-wrap .lbl{color:var(--sub);font-size:12px}
  .amt{font-size:26px;font-weight:700;letter-spacing:-.6px;line-height:1.2}
  .amt small{font-size:13.5px;font-weight:600;color:var(--sub);margin-left:9px}
  .bottom .spacer{flex:1}
  .bbtn{
    background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 15px;
    font-size:13px;color:var(--ink);cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap;
  }
  .bbtn:hover{border-color:var(--brand);color:var(--brand)}
  .bbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .bbtn.primary:hover{background:#e64800;color:#fff}

  .note{
    margin-top:22px;font-size:12.5px;color:var(--sub);line-height:1.95;
    background:#fff;border:1px dashed var(--line);border-radius:12px;padding:14px 18px;
  }
  .note b{color:var(--ink)}

  @media (max-width:720px){
    body{padding:22px 12px 150px}
    .card{grid-template-columns:1fr auto;gap:12px;padding:14px 15px}
    .right{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;width:100%}
    .group-head{top:60px}
    h1{font-size:21px}
  }
</style>

<style>
#gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#1f2430,#3a4152);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:20px}
#gate .card{background:#fff;border-radius:18px;padding:40px 34px;width:100%;max-width:360px;
box-shadow:0 20px 60px rgba(0,0,0,.28);text-align:center}
#gate h1{font-size:19px;font-weight:700;margin-bottom:6px;color:#191b1f}
#gate .sub{font-size:13px;color:#6b7280;margin-bottom:26px;line-height:1.6}

#gate input{width:100%;height:46px;border:1px solid #e7e9ec;border-radius:10px;padding:0 14px;
font-size:15px;font-family:inherit;outline:none;transition:.15s;letter-spacing:1px}
#gate input:focus{border-color:#ff5000;box-shadow:0 0 0 3px rgba(255,80,0,.1)}

border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
#gate button:hover{background:#e64800}
#gate .err{background:#fff1f0;border:1px solid #ffccc7;color:#cf1322;border-radius:9px;
padding:9px 12px;font-size:12.5px;margin-bottom:14px;text-align:left;display:none}
</style>
</head>

</div>

<div class="bottom">

    <button class="bbtn" id="copyBtn">复制清单</button>

  </div>
</div>

const money = n => '¥' + n.toFixed(2);
const listEl = document.getElementById('list');
const GMAP = Object.fromEntries(GROUPS.map(g => [g.key, g]));

GROUPS.forEach(g => {
  const items = ITEMS.filter(i => i.g === g.key);
  if (!items.length) return;

  const sec = document.createElement('section');
  sec.className = 'group';
  sec.dataset.g = g.key;
  sec.innerHTML = `
    <div class="group-head">
      <span class="dot" style="background:${g.color}"></span>
      <h2>${g.name}</h2>
      <span class="cnt">${items.length} 项</span>
      <span class="gsub"></span>
    </div>`;
  const body = document.createElement('div');
  body.className = 'gbody';
  sec.appendChild(body);

  items.forEach(it => {
    const hasPrice = typeof it.price === 'number';
    const card = document.createElement('div');
    card.className = 'card q0';
    card.dataset.name = (it.name + ' ' + it.spec).toLowerCase();
    card.dataset.sku = it.sku;
    card.innerHTML = `
      <div>
        <div class="title">${it.name} <span class="tag">${it.spec}</span>${hasPrice ? '' : '<span class="tag gray">价格待确认</span>'}</div>
        <div class="meta">
          ${hasPrice ? '单价 ' + money(it.price) : '单价 <span class="unknown">—</span>'} &nbsp;·&nbsp;
          ${it.sku ? 'SKU <span class="sku">' + it.sku + '</span>' : 'SKU <span class="sku">未指定</span>'}<br>
          小计 <b class="sub">—</b>
        </div>
      </div>
      <div class="stepper">
        <button data-a="-1" aria-label="减少">−</button>
        <input type="number" min="0" max="999" value="0" aria-label="数量">
        <button data-a="1" aria-label="增加">+</button>
      </div>
      <div class="right">
        <div class="price">小计 <b class="sub">—</b></div>
        <a class="buy" href="${it.url}" target="_blank" rel="noopener">去购买 →</a>
      </div>`;
    body.appendChild(card);

    const input = card.querySelector('input');
    const sub = card.querySelectorAll('.sub');
    const qty = () => Math.max(0, parseInt(input.value || '0', 10));

    const sync = () => {
      const q = qty();
      input.value = q;
      const val = hasPrice ? money(it.price * q) : (q > 0 ? '待确认' : '—');
      sub.forEach(el => el.textContent = val);
      card.classList.toggle('q0', q === 0);
      update();
    };
    input.addEventListener('input', sync);
    input.addEventListener('change', sync);
    card.querySelectorAll('.stepper button').forEach(b => {
      b.addEventListener('click', () => { input.value = qty() + Number(b.dataset.a); sync(); });
    });
    it._card = card; it._input = input; it._sync = sync; it._qty = qty;
    it._hasPrice = hasPrice;
  });

  listEl.appendChild(sec);
});

function visibleItems() {
  const kw = document.getElementById('q').value.trim().toLowerCase();
  return ITEMS.filter(it => {
    const card = it._card;
    if (!kw) { card.classList.remove('hide'); return true; }
    const hit = card.dataset.name.includes(kw) || card.dataset.sku.includes(kw);
    card.classList.toggle('hide', !hit);
    return hit;
  });
}

function update() {
  const vis = visibleItems();
  let total = 0, count = 0, kinds = 0;
  GROUPS.forEach(g => {
    const sec = listEl.querySelector('section[data-g="' + g.key + '"]');
    const items = ITEMS.filter(i => i.g === g.key);
    let gTotal = 0, gCount = 0, gVis = 0;
    items.forEach(it => {
      const q = it._qty();
      if (q > 0) { gCount += q; kinds++; }
      if (it._hasPrice) gTotal += it.price * q;
    });
    items.forEach(it => { if (!it._card.classList.contains('hide')) gVis++; });
    const head = sec.querySelector('.gsub');
    head.textContent = gVis ? `小计 ${money(gTotal)} · ${gCount} 件` : '';
    sec.style.display = gVis ? '' : 'none';
    total += gTotal; count += gCount;
  });
  document.getElementById('grand').innerHTML = money(total) + '<small>' + count + ' 件</small>';
  document.getElementById('statItems').textContent = vis.length;
  document.getElementById('statPicked').textContent = count;
  document.getElementById('statTop').textContent = money(total);
}

document.getElementById('q').addEventListener('input', update);

document.querySelectorAll('.preset button').forEach(b => {
  b.addEventListener('click', () => {
    const n = Number(b.dataset.all);
    ITEMS.forEach(it => { it._input.value = n; it._sync(); });
  });
});

document.getElementById('resetBtn').addEventListener('click', () => {
  ITEMS.forEach(it => { it._input.value = 0; it._sync(); });
});

function copy(text, btn, label) {
  const ok = () => { const o = btn.textContent; btn.textContent = '已复制 ✓'; setTimeout(() => btn.textContent = o, 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok).catch(() => fb(text, ok));
  else fb(text, ok);
}
function fb(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch (e) { alert(text); }
  document.body.removeChild(ta);
}

document.getElementById('copyBtn').addEventListener('click', function () {
  const lines = [];
  GROUPS.forEach(g => {
    const sel = ITEMS.filter(i => i.g === g.key && i._qty() > 0);
    if (!sel.length) return;
    lines.push(`【${g.name}】`);
    sel.forEach(it => {
      const p = it._hasPrice ? money(it.price * it._qty()) : '价格待确认';
      lines.push(`  ${it.name} × ${it._qty()}   单价 ${it._hasPrice ? money(it.price) : '—'}   小计 ${p}`);
    });
  });
  const picked = ITEMS.filter(i => i._qty() > 0);
  const total = picked.reduce((s, i) => s + (i._hasPrice ? i.price * i._qty() : 0), 0);
  lines.push('', `合计：${money(total)}（${picked.reduce((s,i)=>s+i._qty(),0)} 件，${picked.length} 个品种）`);
  copy(lines.join('\n'), this);
});

document.getElementById('copyLinkBtn').addEventListener('click', function () {
  const lines = ITEMS.filter(i => i._qty() > 0).map(it => `${it.name}  ${it.url}`);
  if (!lines.length) { alert('请先设置数量'); return; }
  copy(lines.join('\n'), this);
});

update();
</script>

  window.wgdzLogin = function(ev){

      unlock();
    } else {

    }
    return false;
  };
})();
