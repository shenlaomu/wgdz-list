<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>150kv 机柜物料清单</title>
<script>if(location.search.indexOf('v=1')===-1){location.replace('./index.html');}</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#1f2430,#3a4152);padding:32px 20px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:820px}
  header{text-align:center;margin-bottom:34px;color:#fff}
  h1{font-size:28px;font-weight:700;letter-spacing:-.5px}
  .sub{font-size:14px;color:#aab3c2;margin-top:10px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .card{
    display:block;background:#fff;border-radius:20px;padding:32px 28px;text-decoration:none;
    box-shadow:0 14px 40px rgba(0,0,0,.22);transition:.2s;position:relative;overflow:hidden;
  }
  .card:hover{transform:translateY(-5px);box-shadow:0 22px 52px rgba(0,0,0,.32)}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
  .badge{
    display:inline-block;font-size:12px;font-weight:700;padding:5px 12px;border-radius:30px;
    background:var(--soft);color:var(--c);margin-bottom:18px;letter-spacing:.5px;
  }
  .name{font-size:22px;font-weight:700;color:#191b1f;margin-bottom:10px;letter-spacing:-.3px}
  .desc{font-size:13.5px;color:#6b7280;line-height:1.8;margin-bottom:22px}
  .foot{display:flex;justify-content:space-between;align-items:center;
    border-top:1px solid #eef0f2;padding-top:16px;font-size:13px;color:#6b7280}
  .go{font-weight:700;color:var(--c)}
  .cartbar{
    display:flex;align-items:center;gap:14px;margin-top:20px;
    background:#fff;border-radius:16px;padding:18px 22px;text-decoration:none;
    box-shadow:0 14px 40px rgba(0,0,0,.22);transition:.2s;
  }
  .cartbar:hover{transform:translateY(-3px);box-shadow:0 20px 52px rgba(0,0,0,.32)}
  .cartbar .ic{font-size:26px}
  .cartbar .tx{display:flex;flex-direction:column;flex:1;color:#191b1f}
  .cartbar .tx b{font-size:16px}
  .cartbar .tx small{color:#6b7280;font-size:12.5px;margin-top:4px}
  .cartbar .go{font-weight:700;color:#ff5000;white-space:nowrap}
  footer{text-align:center;margin-top:26px;font-size:12.5px;color:#8a93a5}
  footer a{color:#aab3c2;text-decoration:none}
  footer a:hover{color:#fff}
  @media (max-width:680px){.cards{grid-template-columns:1fr}h1{font-size:22px}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>150kv 机柜物料清单</h1>
    <p class="sub">请选择要查看的版本</p>
  </header>

  <div class="cards">
    <a class="card" href="./150kv-import.html?v=1" style="--c:#2563eb;--soft:#e8effd">
      <span class="badge">150kv · 进口版</span>
      <div class="name">150kv进口版机柜物料购买清单</div>
      <div class="desc">欧姆龙 PLC 方案，含控制、继电器、电源滤波、气动元件及通信连接器。</div>
      <div class="foot"><span>46 项物料 · 支持加入购物车</span><span class="go">进入清单 →</span></div>
    </a>

    <a class="card" href="./150kv-gc.html?v=1" style="--c:#ff5000;--soft:#fff1ea">
      <span class="badge">150kv · 国产版</span>
      <div class="name">150kv国产版机柜物料购买清单</div>
      <div class="desc">汇川 PLC 方案，新增输出模块、ADDA 混合模块、气泵及五金结构件。</div>
      <div class="foot"><span>47 项物料 · 支持加入购物车</span><span class="go">进入清单 →</span></div>
    </a>
  </div>

  <a class="cartbar" href="./checkout.html">
    <span class="ic">🛒</span>
    <span class="tx"><b>购物车</b><small id="cartInfo">正在读取…</small></span>
    <span class="go">去结算 →</span>
  </a>

  <footer><a href="./index.html">&larr; 返回清单首页</a></footer>
</div>

<script>
(function(){
  var KEY='wgdz_cart_v1', c=[];
  try { c=JSON.parse(localStorage.getItem(KEY)||'[]'); } catch(e){ c=[]; }
  if(!Array.isArray(c)) c=[];
  var n=0, total=0, unknown=false;
  c.forEach(function(it){
    var q = Number(it.qty) || 0;
    n += q;
    if(it.price===null || it.price===undefined || isNaN(it.price)) unknown=true;
    else total += it.price * q;
  });
  var el=document.getElementById('cartInfo');
  if(el){
    el.textContent = n
      ? ('已有 ' + n + ' 件物料，合计约 ¥' + (Math.round(total*100)/100).toFixed(2) + (unknown ? '（部分价格待确认）' : ''))
      : '还没有加入物料，先进清单设数量再加入';
  }
})();
</script>
<style>
#floatCart{position:fixed;right:16px;bottom:88px;z-index:9990;display:flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#ff5000,#ff7a2f);color:#fff;text-decoration:none;
  padding:11px 16px;border-radius:26px;box-shadow:0 6px 18px rgba(255,80,0,.30);
  font-size:13px;font-weight:600;font-family:inherit;line-height:1;-webkit-tap-highlight-color:transparent}
#floatCart:active{transform:scale(.97)}
#fcNum{background:#fff;color:#ff5000;border-radius:99px;padding:2px 7px;font-size:11px;line-height:1.35;min-width:14px;text-align:center}
@media (max-width:560px){
  #floatCart{right:12px;bottom:96px;width:52px;height:52px;padding:0;border-radius:50%;
    justify-content:center;gap:0}
  #floatCart{display:none}
  #floatCart .fc-ico{font-size:21px;line-height:1}
  #fcNum{position:absolute;top:-3px;right:-3px;border:2px solid #fff;font-size:10px;padding:0 4px}
}
</style>
<a id="floatCart" href="./checkout.html" title="打开我的采购车">
  <span class="fc-ico">🛒</span><span class="fc-txt">采购车</span><b id="fcNum" style="display:none">0</b>
</a>
<script>
(function(){
  try{
    var d = JSON.parse(localStorage.getItem('wgdz_cart_v1') || '[]');
    if (!Array.isArray(d)) return;
    var n = 0;
    d.forEach(function(x){ if (x.sel !== false) n += (Number(x.qty) || 1); });
    var el = document.getElementById('fcNum');
    if (el && n > 0) { el.textContent = n > 99 ? '99+' : n; el.style.display = 'inline-block'; }
  }catch(e){}
})();
</script>
</body>
</html>
