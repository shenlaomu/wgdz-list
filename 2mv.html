<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2MV 采购清单</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --primary: #ff5000; --text: #222;
    --muted: #888; --border: #e8e8e8; --ok: #07c160;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); padding-bottom: 88px; }
  header { background: linear-gradient(135deg, #ff5000, #ff7a2f); color: #fff; padding: 26px 16px 20px; text-align: center; }
  header h1 { font-size: 21px; margin-bottom: 6px; }
  header p { font-size: 12.5px; opacity: .92; }
  .stats { display: flex; justify-content: center; gap: 26px; margin-top: 14px; font-size: 13px; }
  .stats b { font-size: 19px; }
  .container { max-width: 820px; margin: 0 auto; padding: 14px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar button { border: 1px solid var(--border); background: #fff; border-radius: 18px; padding: 6px 13px; font-size: 12.5px; cursor: pointer; color: #555; }
  .toolbar button:hover { border-color: var(--primary); color: var(--primary); }
  .item { background: var(--card); border-radius: 12px; padding: 13px 14px; margin-bottom: 10px; display: flex; gap: 12px; border: 1px solid var(--border); transition: box-shadow .2s, border-color .2s; }
  .item:hover { box-shadow: 0 2px 12px rgba(0,0,0,.07); }
  .item.checked { border-color: var(--ok); background: #f6fff9; }
  .item input[type=checkbox] { width: 19px; height: 19px; margin-top: 4px; accent-color: var(--ok); cursor: pointer; flex: 0 0 auto; }
  .body { flex: 1; min-width: 0; }
  .row1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .no { font-size: 11.5px; color: #fff; background: #c9ccd1; border-radius: 6px; padding: 1px 7px; font-weight: 600; }
  .name { font-size: 15px; font-weight: 600; }
  .plat { font-size: 11px; padding: 2px 8px; border-radius: 9px; background: #fff0e8; color: var(--primary); }
  .plat.tm { background: #ffe9f3; color: #e0237a; }
  .row2 { display: flex; align-items: center; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  .price { color: var(--primary); font-size: 18px; font-weight: 700; }
  .price small { font-size: 12px; font-weight: 400; }
  .price.na { font-size: 13px; color: var(--muted); font-weight: 500; }
  .qty { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .qty button { border: none; background: #f7f7f7; width: 27px; height: 27px; cursor: pointer; font-size: 15px; color: #555; }
  .qty span { min-width: 32px; text-align: center; font-size: 13.5px; line-height: 27px; }
  .acts { margin-left: auto; display: flex; gap: 7px; }
  .btn { border: none; border-radius: 8px; padding: 6px 13px; font-size: 12.5px; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn-buy { background: linear-gradient(135deg, #ff5000, #ff7a2f); color: #fff; }
  .btn-copy { background: #f0f1f3; color: #555; }
  .btn-copy:hover { background: #e2e4e8; }
  footer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); display: flex; align-items: center; padding: 11px 16px; gap: 14px; box-shadow: 0 -2px 12px rgba(0,0,0,.06); z-index: 100; }
  footer-bar .total { font-size: 13.5px; color: #555; }
  footer-bar .total b { color: var(--primary); font-size: 21px; }
  footer-bar .total .cnt { color: var(--ok); font-size: 12.5px; margin-left: 5px; }
  #buyAll { margin-left: auto; background: linear-gradient(135deg, #ff5000, #ff7a2f); color: #fff; border: none; border-radius: 22px; padding: 11px 26px; font-size: 14.5px; font-weight: 600; cursor: pointer; }
  #buyAll:disabled { background: #ccc; cursor: not-allowed; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: rgba(0,0,0,.82); color: #fff; padding: 9px 18px; border-radius: 18px; font-size: 12.5px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 200; }
  .toast.show { opacity: 1; }
</style>

<style>
.wgdz-bar{background:#1f2430;padding:9px 15px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wgdz-bar a{color:#aab3c2;font-size:12.5px;text-decoration:none}
.wgdz-bar a:hover{color:#fff}
</style>
</head>
<body>
<div class="wgdz-bar"><a href="./index.html">&larr; 返回清单首页</a></div>
<div id="app">


<header>
  <h1>🛒 2MV 采购清单</h1>
  <p>共 26 件商品 · 逐项独立 · 点击「去购买」直达淘宝 / 天猫</p>
  <div class="stats">
    <span>已选 <b id="selCount">0</b> 件</span>
    <span>合计 ¥<b id="selTotal">0.00</b></span>
  </div>
</header>

<div class="container">
  <div class="toolbar">
    <button onclick="selectAll(true)">✅ 全选</button>
    <button onclick="selectAll(false)">⬜ 取消全选</button>
    <button onclick="copyChecked()">📋 复制已选链接</button>
    <button onclick="copyAll()">📋 复制全部链接</button>
    <button onclick="openCart()" style="border-color:#07c160;color:#07c160;font-weight:600">🛒 打开购物车 · 合并付款</button>
    <button onclick="wgdzAddCart()">🛒 加入购物车</button>
  </div>
  <div id="list"></div>
</div>

<footer-bar>
  <div class="total">
    合计：<b>¥<span id="barTotal">0.00</span></b>
    <span class="cnt">（<span id="barCount">0</span>/26 件）</span>
  </div>
  <button id="buyAll" onclick="openChecked()" disabled>逐个打开已选商品页 (0)</button>
</footer-bar>

<div class="toast" id="toast"></div>

<script>
const items = [
  { name: "PLC", price: 1223.00, plat: "天猫", url: "https://detail.tmall.com/item.htm?id=925807782781&skuId=5805889320895" },
  { name: "扩展模块", price: 218.00, plat: "天猫", url: "https://detail.tmall.com/item.htm?id=1082190489448&skuId=6299440711869" },
  { name: "DO-R 模块", price: 650.00, plat: "天猫", url: "https://detail.tmall.com/item.htm?id=927322562695&skuId=5808973136758" },
  { name: "信号隔离器", price: 237.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=794705407037&skuId=5595117567575" },
  { name: "DB9", price: 24.24, plat: "天猫", url: "https://detail.tmall.com/item.htm?id=769881372386&skuId=5280227501101" },
  { name: "RS232 转光纤", price: 373.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=706303513983&skuId=6041050038519" },
  { name: "DBL 放大板", price: null, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=20438387531&skuId=5627834333518" },
  { name: "继电器模组", price: 128.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=537869665345&skuId=5620008974557" },
  { name: "DCDC 隔离电源模块", price: 23.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=4175918250&skuId=4112823764841" },
  { name: "隔离变压器", price: 179.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=588726981966&skuId=4189219651033" },
  { name: "隔离变压器", price: 120.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=598350685349" },
  { name: "电源变压器", price: 48.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=546641176962" },
  { name: "熔断器", price: 23.18, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=750796886842&skuId=5349201431363" },
  { name: "中间继电器", price: 20.30, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=1047894148027&skuId=6236971107735" },
  { name: "信号隔离器", price: 100.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=551709559532&skuId=3537087998117" },
  { name: "单相交流电源滤波器", price: 19.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=776571601999&skuId=5478305918692" },
  { name: "单相直流电源滤波器", price: 33.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=530497882919&skuId=3975565896983" },
  { name: "电源滤波器", price: 17.89, plat: "天猫", url: "https://detail.tmall.com/item.htm?id=814192684552&skuId=5676660082015" },
  { name: "电动调压器", price: 228.00, plat: "天猫", url: "https://detail.tmall.com/item.htm?id=642125156058&skuId=4624824097383" },
  { name: "EMI 电源滤波器", price: 56.20, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=1077936061953&skuId=6293739174068" },
  { name: "开关电源", price: 73.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=684323954762&skuId=5065419387234" },
  { name: "急停按钮", price: 7.26, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=657022258362&skuId=4909779394057" },
  { name: "空气开关", price: 33.49, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=913551813369&skuId=5814332941958" },
  { name: "指示灯", price: 12.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=591633319215&skuId=4060227956038" },
  { name: "气压传感器", price: 343.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=675835655850&skuId=6101273880658" },
  { name: "电磁阀线圈", price: 49.50, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=816048132316&skuId=5697226366859" }
];

const qtyState = items.map(() => 1);
const listEl = document.getElementById("list");

items.forEach((it, idx) => {
  const priceHtml = it.price === null
    ? `<span class="price na">价格以商品页为准</span>`
    : `<span class="price"><small>¥</small>${it.price.toFixed(2)}</span>`;
  const div = document.createElement("div");
  div.className = "item";
  div.innerHTML = `
    <input type="checkbox" data-idx="${idx}">
    <div class="body">
      <div class="row1">
        <span class="no">${idx + 1}</span>
        <span class="name">${it.name}</span>
        <span class="plat ${it.plat === "天猫" ? "tm" : ""}">${it.plat}</span>
      </div>
      <div class="row2">
        ${priceHtml}
        <div class="qty">
          <button onclick="changeQty(${idx},-1)">−</button>
          <span id="qty-${idx}">1</span>
          <button onclick="changeQty(${idx},1)">＋</button>
        </div>
        <div class="acts">
          <button class="btn btn-copy" onclick="copyLink(${idx})">复制链接</button>
          <a class="btn btn-buy" id="buy-${idx}" href="${it.url}" target="_blank">去购买 →</a>
        </div>
      </div>
    </div>`;
  div.querySelector("input").addEventListener("change", updateTotals);
  listEl.appendChild(div);
});

function changeQty(idx, d) {
  qtyState[idx] = Math.max(1, Math.min(99, qtyState[idx] + d));
  document.getElementById(`qty-${idx}`).textContent = qtyState[idx];
  var bb = document.getElementById('buy-' + idx);
  if (bb) bb.textContent = qtyState[idx] > 1 ? ('去购买 ×' + qtyState[idx] + ' →') : '去购买 →';
  updateTotals();
}

function updateTotals() {
  let count = 0, total = 0, unknown = false;
  document.querySelectorAll("#list input[type=checkbox]").forEach(cb => {
    const i = +cb.dataset.idx;
    cb.closest(".item").classList.toggle("checked", cb.checked);
    if (cb.checked) {
      count += qtyState[i];
      if (items[i].price === null) unknown = true;
      else total += items[i].price * qtyState[i];
    }
  });
  document.getElementById("selCount").textContent = count;
  document.getElementById("selTotal").textContent = total.toFixed(2) + (unknown ? " +" : "");
  document.getElementById("barTotal").textContent = total.toFixed(2) + (unknown ? " +" : "");
  document.getElementById("barCount").textContent = count;
  const b = document.getElementById("buyAll");
  b.disabled = count === 0;
  b.textContent = count === 0 ? "去结算已选 (0)" : `去结算已选 (${count})`;
}

function selectAll(on) {
  document.querySelectorAll("#list input[type=checkbox]").forEach(cb => cb.checked = on);
  updateTotals();
}
function checkedIdx() {
  return [...document.querySelectorAll("#list input[type=checkbox]")]
    .filter(cb => cb.checked).map(cb => +cb.dataset.idx);
}
function openChecked() {
  const idxs = checkedIdx();
  if (!idxs.length) return toast("请先勾选商品");
  idxs.forEach((i, k) => setTimeout(() => window.open(items[i].url, "_blank"), k * 300));
  toast("已打开已选商品页 → 逐个点「加入购物车」");
}
function openCart() {
  window.open("https://cart.taobao.com/cart.htm", "_blank");
  toast("购物车已打开 → 全选后点「结算」即可合并付款");
}
function copyText(t) {
  navigator.clipboard.writeText(t).then(() => toast("已复制 ✅")).catch(() => toast("复制失败，请手动复制"));
}
function copyLink(i) { copyText(items[i].url); }
function copyAll() {
  copyText(items.map((it, i) => `${i + 1}. ${it.name}（${it.price === null ? "价格见商品页" : "¥" + it.price.toFixed(2)}）：${it.url}`).join("\n"));
}
function copyChecked() {
  const idxs = checkedIdx();
  if (!idxs.length) return toast("请先勾选商品");
  copyText(idxs.map(i => `${items[i].name} ×${qtyState[i]}（${items[i].price === null ? "价格见商品页" : "¥" + (items[i].price * qtyState[i]).toFixed(2)}）：${items[i].url}`).join("\n"));
}
let timer;
function toast(m) {
  const t = document.getElementById("toast");
  t.textContent = m; t.classList.add("show");
  clearTimeout(timer);
  timer = setTimeout(() => t.classList.remove("show"), 1700);
}

updateTotals();
</script>

</div>

<script>
window.wgdzAddCart = function(){
  var idxs = [];
  try {
    idxs = (typeof getCheckedIndices === 'function') ? getCheckedIndices() : checkedIdx();
  } catch(e) { idxs = []; }
  if (!idxs || !idxs.length) {
    if (typeof toast === 'function') { toast('请先勾选要采购的物料'); } else { alert('请先勾选要采购的物料'); }
    return;
  }
  var list = idxs.map(function(i){
    var it = items[i];
    var q = (typeof qtyState !== 'undefined' && qtyState[i]) ? qtyState[i] : 1;
    return {
      name: it.name,
      spec: it.desc || '',
      price: (it.price === null || it.price === undefined) ? null : it.price,
      url: it.url,
      qty: q
    };
  });

function wgdzPushCart(list){
  var KEY = 'wgdz_cart_v1';
  var cart = [];
  try { cart = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e){ cart = []; }
  if (!Array.isArray(cart)) cart = [];
  var from = document.title || '物料清单';
  var added = 0;
  list.forEach(function(it){
    var idx = -1;
    for (var i = 0; i < cart.length; i++) {
      if (cart[i].url === it.url) { idx = i; break; }
    }
    if (idx >= 0) {
      cart[idx].qty = Math.min(99, cart[idx].qty + it.qty);
      cart[idx].sel = true;
    } else {
      cart.push({ name: it.name, spec: it.spec || '', price: it.price,
                  url: it.url, qty: it.qty, sel: true, from: from });
    }
    added += it.qty;
  });
  try { localStorage.setItem(KEY, JSON.stringify(cart)); } catch(e) {}
  location.href = './checkout.html';
}

  wgdzPushCart(list);
};
</script>
</body>

</html>
