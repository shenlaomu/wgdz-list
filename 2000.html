<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2000柜采购清单（第二批）</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --primary: #ff5000;
    --text: #222;
    --muted: #888;
    --border: #e8e8e8;
    --ok: #07c160;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); padding-bottom: 88px;
  }
  header {
    background: linear-gradient(135deg, #ff5000, #ff7a2f);
    color: #fff; padding: 26px 16px 20px; text-align: center;
  }
  header h1 { font-size: 21px; margin-bottom: 6px; }
  header p { font-size: 12.5px; opacity: .92; }
  .stats { display: flex; justify-content: center; gap: 26px; margin-top: 14px; font-size: 13px; }
  .stats b { font-size: 19px; }

  .container { max-width: 820px; margin: 0 auto; padding: 14px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar button {
    border: 1px solid var(--border); background: #fff; border-radius: 18px;
    padding: 6px 13px; font-size: 12.5px; cursor: pointer; color: #555;
  }
  .toolbar button:hover { border-color: var(--primary); color: var(--primary); }

  .item {
    background: var(--card); border-radius: 12px; padding: 13px 14px;
    margin-bottom: 10px; display: flex; gap: 12px;
    border: 1px solid var(--border); transition: box-shadow .2s, border-color .2s;
  }
  .item:hover { box-shadow: 0 2px 12px rgba(0,0,0,.07); }
  .item.checked { border-color: var(--ok); background: #f6fff9; }
  .item input[type=checkbox] {
    width: 19px; height: 19px; margin-top: 4px; accent-color: var(--ok); cursor: pointer; flex: 0 0 auto;
  }
  .body { flex: 1; min-width: 0; }
  .row1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .no {
    font-size: 11.5px; color: #fff; background: #c9ccd1; border-radius: 6px;
    padding: 1px 7px; font-weight: 600;
  }
  .name { font-size: 15px; font-weight: 600; }
  .plat { font-size: 11px; padding: 2px 8px; border-radius: 9px; background: #fff0e8; color: var(--primary); }
  .plat.tm { background: #ffe9f3; color: #e0237a; }
  .row2 { display: flex; align-items: center; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  .price { color: var(--primary); font-size: 18px; font-weight: 700; }
  .price small { font-size: 12px; font-weight: 400; }
  .qty { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .qty button { border: none; background: #f7f7f7; width: 27px; height: 27px; cursor: pointer; font-size: 15px; color: #555; }
  .qty span { min-width: 32px; text-align: center; font-size: 13.5px; line-height: 27px; }
  .acts { margin-left: auto; display: flex; gap: 7px; }
  .btn {
    border: none; border-radius: 8px; padding: 6px 13px; font-size: 12.5px;
    cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  .btn-buy { background: linear-gradient(135deg, #ff5000, #ff7a2f); color: #fff; }
  .btn-copy { background: #f0f1f3; color: #555; }
  .btn-copy:hover { background: #e2e4e8; }

  footer-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
    border-top: 1px solid var(--border); display: flex; align-items: center;
    padding: 11px 16px; gap: 14px; box-shadow: 0 -2px 12px rgba(0,0,0,.06); z-index: 100;
  }
  footer-bar .total { font-size: 13.5px; color: #555; }
  footer-bar .total b { color: var(--primary); font-size: 21px; }
  footer-bar .total .cnt { color: var(--ok); font-size: 12.5px; margin-left: 5px; }
  #buyAll {
    margin-left: auto; background: linear-gradient(135deg, #ff5000, #ff7a2f); color: #fff;
    border: none; border-radius: 22px; padding: 11px 26px; font-size: 14.5px; font-weight: 600; cursor: pointer;
  }
  #buyAll:disabled { background: #ccc; cursor: not-allowed; }
  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: rgba(0,0,0,.82); color: #fff; padding: 9px 18px; border-radius: 18px;
    font-size: 12.5px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 200;
  }
  .toast.show { opacity: 1; }
</style>

<style>
#gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#1f2430,#3a4152);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:20px}
#gate .card{background:#fff;border-radius:18px;padding:40px 34px;width:100%;max-width:360px;
box-shadow:0 20px 60px rgba(0,0,0,.28);text-align:center}
#gate h1{font-size:19px;font-weight:700;margin-bottom:6px;color:#191b1f}
#gate .sub{font-size:13px;color:#6b7280;margin-bottom:26px;line-height:1.6}
#gate label{display:block;font-size:12.5px;color:#6b7280;text-align:left;margin-bottom:7px}
#gate input{width:100%;height:46px;border:1px solid #e7e9ec;border-radius:10px;padding:0 14px;
font-size:15px;font-family:inherit;outline:none;transition:.15s;letter-spacing:1px}
#gate input:focus{border-color:#ff5000;box-shadow:0 0 0 3px rgba(255,80,0,.1)}
#gate button{width:100%;height:46px;margin-top:16px;background:#ff5000;color:#fff;border:0;
border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
#gate button:hover{background:#e64800}
#gate .err{background:#fff1f0;border:1px solid #ffccc7;color:#cf1322;border-radius:9px;
padding:9px 12px;font-size:12.5px;margin-bottom:14px;text-align:left;display:none}
.wgdz-bar{background:#1f2430;padding:9px 15px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wgdz-bar a{color:#aab3c2;font-size:12.5px;text-decoration:none}
.wgdz-bar a:hover{color:#fff}
</style>
</head>
<body>
<div id="gate" style="display:none">
  <form class="card" onsubmit="return wgdzLogin(event)">
    <div style="width:64px;height:64px;margin:0 auto 18px;border-radius:50%;background:#fff1ea;display:flex;align-items:center;justify-content:center">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ff5000" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <h1>WGDZ物料清单</h1>
    <p class="sub">该页面受访问保护<br>请输入访问密码</p>
    <div class="err" id="gateErr">密码不正确，请重新输入</div>
    <label for="gatePw">访问密码</label>
    <input id="gatePw" type="password" placeholder="请输入密码" autocomplete="current-password">
    <button type="submit">进入清单</button>
  </form>
</div>
<div class="wgdz-bar"><a href="./index.html">&larr; 返回清单首页</a></div>
<div id="app" style="display:none">


<header>
  <h1>🛒 2000柜采购清单 · 第二批</h1>
  <p>共 24 件商品 · 逐项独立 · 点击「去购买」直达淘宝 / 天猫</p>
  <div class="stats">
    <span>已选 <b id="selCount">0</b> 件</span>
    <span>合计 ¥<b id="selTotal">0.00</b></span>
  </div>
</header>

<div class="container">
  <div class="toolbar">
    <button onclick="selectAll(true)">✅ 全选</button>
    <button onclick="selectAll(false)">⬜ 取消全选</button>
    <button onclick="copyChecked()">📋 复制已选链接</button>
    <button onclick="copyAll()">📋 复制全部链接</button>
    <button onclick="wgdzAddCart()">🛒 加入购物车</button>
  </div>
  <div id="list"></div>
</div>

<footer-bar>
  <div class="total">
    合计：<b>¥<span id="barTotal">0.00</span></b>
    <span class="cnt">（<span id="barCount">0</span>/24 件）</span>
  </div>
  <button id="buyAll" onclick="openChecked()" disabled>去结算已选 (0)</button>
</footer-bar>

<div class="toast" id="toast"></div>

<script>
const items = [
  { name: "PLC", price: 745.00, plat: "天猫", url: "https://detail.tmall.com/item.htm?id=859170099356&skuId=5841985351478" },
  { name: "气压传感器", price: 342.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=675835655850&skuId=6101273880658" },
  { name: "PLC 扩展模块", price: 580.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=689917501828&skuId=5080415834255" },
  { name: "DCDC 隔离降压模块", price: 23.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=4175918250&skuId=4112823764841" },
  { name: "信号隔离器", price: 237.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=794705407037&skuId=5595117567575" },
  { name: "DB9", price: 24.24, plat: "天猫", url: "https://detail.tmall.com/item.htm?id=769881372386&skuId=5280227501101" },
  { name: "RS232", price: 373.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=706303513983&skuId=6041050038519" },
  { name: "DBL 直流放大板", price: 152.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=537869665345&skuId=5620008974558" },
  { name: "中间继电器", price: 20.37, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=837280420317&skuId=6013703158199" },
  { name: "单相直流电源滤波器", price: 34.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=563089710634&skuId=3806707808837" },
  { name: "单相直流电源滤波器", price: 45.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=559865562324&skuId=3493645861110" },
  { name: "开关电源", price: 48.50, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=816949486138&skuId=5684471846615" },
  { name: "隔离变送器", price: 67.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=552236004897&skuId=3384266433546" }
  { name: "空气开关", price: 33.49, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=913551813369&skuId=5814332941958" },
  { name: "指示灯", price: 12.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=591633319215&skuId=4060227956038" },
  { name: "电动调压机", price: 228.00, plat: "天猫", url: "https://detail.tmall.com/item.htm?id=642125156058&skuId=4624824097383" },
  { name: "小型无油空压机", price: 451.00, plat: "天猫", url: "https://detail.tmall.com/item.htm?id=785010335187&skuId=5435080932535" },
  { name: "隔离降压变压器", price: 120.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=598350685349" },
  { name: "隔离变压器", price: 185.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=588726981966&skuId=4189219651033" },
  { name: "干式试验变压器", price: 987.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=1094607995878&skuId=6152652228704" },
  { name: "电机综合保护继电器", price: 174.84, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=1089293002211&skuId=6309693250728" },
  { name: "熔断器底座", price: 23.18, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=750796886842&skuId=5349201431362" },
  { name: "气动电磁阀线圈", price: 12.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=602550970415&skuId=4215875448549" },
  { name: "直动式黄铜电磁阀", price: 60.00, plat: "淘宝", url: "https://item.taobao.com/item.htm?id=995216086996&skuId=6141430535158" }
];

const qtyState = items.map(() => 1);
const listEl = document.getElementById("list");

items.forEach((it, idx) => {
  const div = document.createElement("div");
  div.className = "item";
  div.innerHTML = `
    <input type="checkbox" data-idx="${idx}">
    <div class="body">
      <div class="row1">
        <span class="no">${idx + 1}</span>
        <span class="name">${it.name}</span>
        <span class="plat ${it.plat === "天猫" ? "tm" : ""}">${it.plat}</span>
      </div>
      <div class="row2">
        <span class="price"><small>¥</small>${it.price.toFixed(2)}</span>
        <div class="qty">
          <button onclick="changeQty(${idx},-1)">−</button>
          <span id="qty-${idx}">1</span>
          <button onclick="changeQty(${idx},1)">＋</button>
        </div>
        <div class="acts">
          <button class="btn btn-copy" onclick="copyLink(${idx})">复制链接</button>
          <a class="btn btn-buy" href="${it.url}" target="_blank">去购买 →</a>
        </div>
      </div>
    </div>`;
  div.querySelector("input").addEventListener("change", updateTotals);
  listEl.appendChild(div);
});

function changeQty(idx, d) {
  qtyState[idx] = Math.max(1, Math.min(99, qtyState[idx] + d));
  document.getElementById(`qty-${idx}`).textContent = qtyState[idx];
  updateTotals();
}

function updateTotals() {
  let count = 0, total = 0;
  document.querySelectorAll("#list input[type=checkbox]").forEach(cb => {
    const i = +cb.dataset.idx;
    cb.closest(".item").classList.toggle("checked", cb.checked);
    if (cb.checked) { count += qtyState[i]; total += items[i].price * qtyState[i]; }
  });
  document.getElementById("selCount").textContent = count;
  document.getElementById("selTotal").textContent = total.toFixed(2);
  document.getElementById("barTotal").textContent = total.toFixed(2);
  document.getElementById("barCount").textContent = count;
  const b = document.getElementById("buyAll");
  b.disabled = count === 0;
  b.textContent = count === 0 ? "去结算已选 (0)" : `去结算已选 (${count})`;
}

function selectAll(on) {
  document.querySelectorAll("#list input[type=checkbox]").forEach(cb => cb.checked = on);
  updateTotals();
}
function checkedIdx() {
  return [...document.querySelectorAll("#list input[type=checkbox]")]
    .filter(cb => cb.checked).map(cb => +cb.dataset.idx);
}
function openChecked() {
  const idxs = checkedIdx();
  if (!idxs.length) return toast("请先勾选商品");
  idxs.forEach((i, k) => setTimeout(() => window.open(items[i].url, "_blank"), k * 300));
}
function copyText(t) {
  navigator.clipboard.writeText(t).then(() => toast("已复制 ✅")).catch(() => toast("复制失败，请手动复制"));
}
function copyLink(i) { copyText(items[i].url); }
function copyAll() {
  copyText(items.map((it, i) => `${i + 1}. ${it.name}（¥${it.price.toFixed(2)}）：${it.url}`).join("\n"));
}
function copyChecked() {
  const idxs = checkedIdx();
  if (!idxs.length) return toast("请先勾选商品");
  copyText(idxs.map(i => `${items[i].name} ×${qtyState[i]}（¥${(items[i].price * qtyState[i]).toFixed(2)}）：${items[i].url}`).join("\n"));
}
let timer;
function toast(m) {
  const t = document.getElementById("toast");
  t.textContent = m; t.classList.add("show");
  clearTimeout(timer);
  timer = setTimeout(() => t.classList.remove("show"), 1700);
}

updateTotals();
</script>

<script>
(function(){
  var PW = '123456';
  var KEY = 'wgdz_lock';
  var gate = document.getElementById('gate');
  var app  = document.getElementById('app');
  function unlock(){
    if (app) app.style.display = '';
    if (gate) gate.remove();
  }
  window.wgdzLogin = function(ev){
    ev.preventDefault();
    var v = document.getElementById('gatePw').value;
    if (v === PW) {
      try { localStorage.setItem(KEY, PW); } catch(e) {}
      unlock();
    } else {
      document.getElementById('gateErr').style.display = 'block';
    }
    return false;
  };
  try {
    if (localStorage.getItem(KEY) === PW) { unlock(); return; }
  } catch(e) {}
  gate.style.display = 'flex';
})();
</script>
</div>

<script>
window.wgdzAddCart = function(){
  var idxs = [];
  try {
    idxs = (typeof getCheckedIndices === 'function') ? getCheckedIndices() : checkedIdx();
  } catch(e) { idxs = []; }
  if (!idxs || !idxs.length) {
    if (typeof toast === 'function') { toast('请先勾选要采购的物料'); } else { alert('请先勾选要采购的物料'); }
    return;
  }
  var list = idxs.map(function(i){
    var it = items[i];
    var q = (typeof qtyState !== 'undefined' && qtyState[i]) ? qtyState[i] : 1;
    return {
      name: it.name,
      spec: it.desc || '',
      price: (it.price === null || it.price === undefined) ? null : it.price,
      url: it.url,
      qty: q
    };
  });

function wgdzPushCart(list){
  var KEY = 'wgdz_cart_v1';
  var cart = [];
  try { cart = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e){ cart = []; }
  if (!Array.isArray(cart)) cart = [];
  var from = document.title || '物料清单';
  var added = 0;
  list.forEach(function(it){
    var idx = -1;
    for (var i = 0; i < cart.length; i++) {
      if (cart[i].url === it.url) { idx = i; break; }
    }
    if (idx >= 0) {
      cart[idx].qty = Math.min(99, cart[idx].qty + it.qty);
      cart[idx].sel = true;
    } else {
      cart.push({ name: it.name, spec: it.spec || '', price: it.price,
                  url: it.url, qty: it.qty, sel: true, from: from });
    }
    added += it.qty;
  });
  try { localStorage.setItem(KEY, JSON.stringify(cart)); } catch(e) {}
  location.href = './checkout.html';
}

  wgdzPushCart(list);
};
</script>
</body>

</html>
